---
name: KMS Debian 13 ARM64 DEB

permissions: {}

on:
  push:
    branches:
      - codex/kms-rotation
  workflow_dispatch:

jobs:
  package:
    name: Debian 13 ARM64
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash ca-certificates git sudo
          touch "$HOME/.bashrc"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Build and package with the project script
        id: build
        env:
          SUNSHINE_COMPILE_DOXYGEN: 'false'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/linux_build.sh \
            --build-dir=cmake-build-debian13-arm64 \
            --publisher-name="${GITHUB_REPOSITORY_OWNER}" \
            --skip-cuda 2>&1 | tee cmake-build-debian13-arm64.log

      - name: Show build failure in run annotations
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          log_tail=$(tail -n 40 cmake-build-debian13-arm64.log)
          log_tail=${log_tail//'%'/'%25'}
          log_tail=${log_tail//$'\r'/'%0D'}
          log_tail=${log_tail//$'\n'/'%0A'}
          echo "::error title=Debian ARM64 build failure::$log_tail"

      - name: Validate rotation shaders
        run: |
          glslangValidator -S vert src_assets/linux/assets/shaders/opengl/Scene.vert
          glslangValidator -S vert src_assets/linux/assets/shaders/opengl/ConvertUV.vert
          glslangValidator -S frag src_assets/linux/assets/shaders/opengl/ConvertUV.frag

      - name: Test rotation configuration
        id: config_test
        shell: bash
        run: |
          set -o pipefail
          cmake-build-debian13-arm64/tests/test_sunshine \
            --gtest_filter='ConfigManualRotationTest.*' 2>&1 | tee cmake-build-debian13-arm64-test.log

      - name: Show test failure in run annotations
        if: failure() && steps.config_test.outcome == 'failure'
        shell: bash
        run: |
          log_tail=$(tail -n 50 cmake-build-debian13-arm64-test.log)
          log_tail=${log_tail//'%'/'%25'}
          log_tail=${log_tail//$'\r'/'%0D'}
          log_tail=${log_tail//$'\n'/'%0A'}
          echo "::error title=Rotation config test failure::$log_tail"

      - name: Verify Debian package architecture
        shell: bash
        run: |
          shopt -s nullglob
          packages=(cmake-build-debian13-arm64/cpack_artifacts/*.deb)
          test "${#packages[@]}" -gt 0
          for package in "${packages[@]}"; do
            architecture=$(dpkg-deb -f "$package" Architecture)
            echo "$package: $architecture"
            test "$architecture" = arm64
          done

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sunshine-debian13-arm64-kms
          path: cmake-build-debian13-arm64/cpack_artifacts/*.deb
          if-no-files-found: error
